services:
  mongo:
    image: mongo:7
    container_name: longdo-mongo
    ports:
      - "27017:27017"
    volumes:
      - longdo-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  longdo-mongo-data:
